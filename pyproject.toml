[project]
name = "vis-nav-player"
version = "0.0.0"
description = "Example agents for the NYU visual navigation challenge"
requires-python = ">=3.10"
dependencies = [
    "vis-nav-sdk[viewer]",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "scikit-learn>=1.3",
    "networkx>=3.0",
    "tqdm>=4.65",
]

[tool.uv]
package = false

# The SDK lives in ./sdk and is installed from there, editable. The course server depends
# on the same directory through git, so the wire protocol has exactly one home.
[tool.uv.workspace]
members = ["sdk"]

[tool.uv.sources]
vis-nav-sdk = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests", "sdk/tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
